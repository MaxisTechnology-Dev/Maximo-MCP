[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maximo-enterprise-mcp"
version = "0.1.1"
description = "IBM Maximo Asset Management MCP server with a stable tool surface for MCP and hosted API use"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["maximo", "mcp", "ibm", "asset-management", "oslc"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastmcp>=3.2.4",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "redis>=7.4.0",
    "starlette>=1.0.0,<2.0.0",
    "PyYAML>=6.0.3",
    "python-dateutil>=2.9.0.post0",
    "uvicorn>=0.46.0",
]

[project.optional-dependencies]
ai = [
    "chromadb>=1.5.8",
    "openai>=2.32.0",
    "sentence-transformers>=5.4.1",
]
exports = [
    "openpyxl>=3.1.5",
    "reportlab>=4.4.10",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "python-dotenv>=1.2.2",
    "ruff>=0.6.0",
]

[project.scripts]
maximo-enterprise-mcp = "server:main"

[tool.setuptools]
py-modules = ["server"]

[tool.setuptools.packages.find]
include = ["core*", "tools*", "config*"]

[tool.setuptools.package-data]
config = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m not integration')",
]
