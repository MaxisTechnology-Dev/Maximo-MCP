[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maximo-enterprise-mcp"
version = "1.0.0"
description = "An MCP server for IBM Maximo Asset Management, by Maxis Technology — stable tool surface for MCP clients and hosted API use."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["maximo", "mcp", "ibm", "asset-management", "oslc"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastmcp>=2.0.0",
    "fastapi>=0.135.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "redis>=5.0.0",
    "starlette>=0.49.1,<2.0.0",
    "PyYAML>=6.0",
    "python-dateutil>=2.9.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
ai = [
    "chromadb>=0.5.0",
    "openai>=1.40.0",
    "sentence-transformers>=3.0.0",
]
exports = [
    "openpyxl>=3.1.0",
    "reportlab>=4.0.0",
]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "python-dotenv>=1.0.0",
    "ruff>=0.15.12",
]

[project.scripts]
maximo-enterprise-mcp = "server:main"

[tool.setuptools]
py-modules = ["server"]

[tool.setuptools.packages.find]
include = ["core*", "tools*", "config*"]

[tool.setuptools.package-data]
config = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m not integration')",
]
